version: '3.8'

# Docker Compose configuration for DEVELOPMENT with hot-reload
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # Qdrant Vector Database (same as production)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage_dev:/qdrant/storage
    networks:
      - rag-network-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama Embedding Service (same as production)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_data_dev:/root/.ollama
    networks:
      - rag-network-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull nomic-embed-text
        wait

  # TechnicalDocsQa.Api with Hot-Reload (DEV ONLY)
  api-dev:
    build:
      context: ./TechnicalDocsQa.Api
      dockerfile: Dockerfile.dev
    container_name: technicaldocsqa-api-dev
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Storage__DocumentsPath=/app/Storage/documents
      - Storage__RegistryPath=/app/Storage/registry/documents.json
      - Ollama__BaseUrl=http://ollama:11434
      - Qdrant__BaseUrl=http://qdrant:6333
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    volumes:
      # Mount source code for hot-reload
      - ./TechnicalDocsQa.Api:/app
      - api_storage_dev:/app/Storage
      # Exclude bin and obj folders
      - /app/bin
      - /app/obj
    networks:
      - rag-network-dev
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

networks:
  rag-network-dev:
    driver: bridge

volumes:
  qdrant_storage_dev:
    driver: local
  ollama_data_dev:
    driver: local
  api_storage_dev:
    driver: local
